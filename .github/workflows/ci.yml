name: Ybuddy CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1 : Tests unitaires backend ────────────────────────────────────────
  backend-test:
    name: Backend — Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Exécution des tests unitaires
        working-directory: backend
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: test

      - name: Rapport de couverture
        working-directory: backend
        run: npm run test:cov -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: test

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ─── JOB 2 : Build backend ──────────────────────────────────────────────────
  backend-build:
    name: Backend — Build TypeScript
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Compilation TypeScript (nest build)
        working-directory: backend
        run: npm run build

      - name: Upload artefact dist/
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ─── JOB 3 : Build frontend ─────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Build de production (tsc + vite build)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api

      - name: Upload artefact dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── JOB 4 : Vérification sécurité (audit npm) ──────────────────────────────
  security-audit:
    name: Audit de sécurité npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend (vulnerabilités critiques)
        working-directory: backend
        run: npm audit --audit-level=critical || true

      - name: Audit frontend (vulnerabilités critiques)
        working-directory: frontend
        run: npm audit --audit-level=critical || true

  # ─── JOB 5 : Déploiement VPS (CD) ──────────────────────────────────────────
  deploy:
    name: Déploiement VPS OVH
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-build, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier les fichiers vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/ybuddy"
          rm: false

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp /opt/ybuddy/.env.production /opt/ybuddy/backend/.env
            cd /opt/ybuddy
            docker compose -f docker-compose.yml up -d --build
            docker system prune -f

  # ─── JOB 6 : Résumé CI/CD ───────────────────────────────────────────────────
  ci-success:
    name: CI/CD complète
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-build, security-audit, deploy]
    if: always()

    steps:
      - name: Résultat global
        run: |
          echo "✅ Tests unitaires  : ${{ needs.backend-test.result }}"
          echo "✅ Build backend    : ${{ needs.backend-build.result }}"
          echo "✅ Build frontend   : ${{ needs.frontend-build.result }}"
          echo "✅ Audit sécurité  : ${{ needs.security-audit.result }}"
          echo "🚀 Déploiement VPS  : ${{ needs.deploy.result }}"
